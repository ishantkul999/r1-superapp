server:
  port: ${AI_PLANNER_PORT:8087}

spring:
  application:
    name: ai-planner
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:r1superapp}
    username: ${POSTGRES_USER:r1user}
    password: ${POSTGRES_PASSWORD:r1password}
    hikari:
      max-lifetime: 240000
      idle-timeout: 120000
      keepalive-time: 60000
      connection-timeout: 10000
      validation-timeout: 3000
      minimum-idle: 2
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai_svc
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:r1redispass}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # ── Spring AI ────────────────────────────────────────────────────────────
  # Chat comes from Groq (OpenAI-compatible API) via the OpenAI starter;
  # embeddings come from local Ollama via the Ollama starter. Both starters
  # are on the classpath, which would normally give us two ChatModel beans
  # and two EmbeddingModel beans (ambiguous). `spring.ai.model.chat` /
  # `spring.ai.model.embedding` tell Spring AI 1.0 which provider backs each
  # generic interface, so ChatClient/EmbeddingModel injection is unambiguous.
  ai:
    model:
      chat: openai        # → routed to Groq via the base-url override below
      embedding: ollama    # → local, free, no API key
    openai:
      api-key: ${GROQ_API_KEY:stub}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.1-8b-instant}
          temperature: 0.7
          max-tokens: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        schema-name: ai_svc
        table-name: vector_store
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        # Lets Spring AI create/maintain the table itself instead of us
        # hand-writing DDL — see infrastructure/sql/010_ai_svc_vector_store.sql
        # for the one-time extension/schema prerequisite.
        initialize-schema: true

# ── Planner config ────────────────────────────────────────────────────────────
ai:
  planner:
    rag-top-k: 5
    temperature: 0.7
    max-tokens: 1024
    supported-languages: [en, hi, gu]

