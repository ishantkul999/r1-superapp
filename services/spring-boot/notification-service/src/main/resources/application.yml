server:
  port: ${NOTIFICATION_SERVICE_PORT:8093}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:40}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:8}
    accept-count: 100
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:r1superapp}
    username: ${POSTGRES_USER:r1user}
    password: ${POSTGRES_PASSWORD:r1password}
    hikari:
      # Same fix as porter-service: recycle connections before they go
      # stale on this network path, instead of discovering a dead
      # connection mid-request.
      max-lifetime: 240000
      idle-timeout: 120000
      keepalive-time: 60000
      connection-timeout: 10000
      validation-timeout: 3000
      # FIX: this service backs /api/notifications, hit constantly by every
      # active client's polling (every 8-15s per session) — read_heavy.js's
      # "notifications ok" check failing under 50 concurrent VUs, plus the
      # same fast-median/exploding-p95 pattern, points at the same
      # pool-too-small-for-concurrency issue as porter-service, just with a
      # lighter read-mostly workload — smaller bump than porter-service is
      # appropriate here.
      minimum-idle: ${NOTIF_DB_MIN_IDLE:4}
      maximum-pool-size: ${NOTIF_DB_POOL_SIZE:15}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notif_svc
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:r1redispass}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # ── FIX: Kafka consumer rebalance storm ───────────────────────────────
        # Image 2 showed repeated:
        #   "The coordinator is not aware of this member"
        #   "re-joining the group"
        # ROOT CAUSE: session.timeout.ms (default 10s) was too short for the
        # notification-service to process messages + respond to heartbeats
        # simultaneously. The broker kicked it out of the group, triggering
        # rebalance → the consumer joined again → same cycle repeated.
        #
        # FIX: Increase timeouts so the broker tolerates slow consumers.
        session.timeout.ms: 60000          # 60s (was 10s default) — time before broker considers consumer dead
        heartbeat.interval.ms: 20000       # 20s — must be < 1/3 of session.timeout.ms
        max.poll.interval.ms: 300000       # 5min — max time between poll() calls
        max.poll.records: 10               # process fewer records per poll to stay within max.poll.interval.ms


firebase:
  service-account: ${FIREBASE_SERVICE_ACCOUNT:stub}

fast2sms:
  api-key: ${FAST2SMS_API_KEY:stub}