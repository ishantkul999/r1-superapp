server:
  port: ${PORTER_SERVICE_PORT:8092}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:60}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: 100
spring:
  application:
    name: porter-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:r1superapp}
    username: ${POSTGRES_USER:r1user}
    password: ${POSTGRES_PASSWORD:r1password}
    hikari:

      max-lifetime: 240000
      idle-timeout: 120000
      keepalive-time: 60000
      connection-timeout: 10000
      validation-timeout: 3000
      maximum-pool-size: ${PORTER_DB_POOL_SIZE:25}
      minimum-idle: ${PORTER_DB_MIN_IDLE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: porter_svc
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:r1redispass}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: porter-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        session.timeout.ms: 60000
        heartbeat.interval.ms: 20000
        max.poll.interval.ms: 300000

notification-service:
  base-url: http://${NOTIFICATION_SERVICE_HOST:localhost}:${NOTIFICATION_SERVICE_PORT:8093}

auth-service:
  url: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}

internal:
  secret: ${INTERNAL_EVENTS_SECRET:dev-internal-secret}

assignment:
  timeout-seconds: 15
