server:
  port: ${PORTER_SERVICE_PORT:8092}
spring:
  application:
    name: porter-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:r1superapp}
    username: ${POSTGRES_USER:r1user}
    password: ${POSTGRES_PASSWORD:r1password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: porter_svc
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:r1redispass}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: porter-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

notification-service:
  base-url: http://${NOTIFICATION_SERVICE_HOST:localhost}:${NOTIFICATION_SERVICE_PORT:8093}

auth-service:
  url: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}

internal:
  secret: ${INTERNAL_EVENTS_SECRET:dev-internal-secret}

assignment:
  timeout-seconds: 15
